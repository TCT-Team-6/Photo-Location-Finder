openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Storage
    description: Private photo uploads and serving endpoints.
  - name: Investigations
    description: Photo location investigations and the user's saved library.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [Storage]
      summary: Request a private photo upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Invalid file metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /investigations:
    get:
      operationId: listInvestigations
      tags: [Investigations]
      summary: List the signed-in user's investigations
      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
            maxLength: 120
      responses:
        "200":
          description: Investigations belonging to the current user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Investigation"
    post:
      operationId: createInvestigation
      tags: [Investigations]
      summary: Analyze and save an uploaded photo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvestigationInput"
      responses:
        "200":
          description: Existing investigation returned for a replayed client request ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Investigation"
        "201":
          description: Photo analyzed and investigation saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Investigation"
        "400":
          description: Invalid investigation data or unsupported image.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Image-analysis provider quota is exhausted; the uploaded photo is retained for retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Photo analysis failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /investigations/summary:
    get:
      operationId: getInvestigationSummary
      tags: [Investigations]
      summary: Get counts and the latest saved investigation
      responses:
        "200":
          description: Current user's library summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvestigationSummary"
  /investigations/{id}:
    get:
      operationId: getInvestigation
      tags: [Investigations]
      summary: Get one saved investigation
      parameters:
        - $ref: "#/components/parameters/InvestigationId"
      responses:
        "200":
          description: The requested investigation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Investigation"
        "404":
          description: Investigation not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      operationId: updateInvestigation
      tags: [Investigations]
      summary: Update an investigation's title or background notes
      parameters:
        - $ref: "#/components/parameters/InvestigationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvestigationUpdate"
      responses:
        "200":
          description: Updated investigation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Investigation"
        "404":
          description: Investigation not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      operationId: deleteInvestigation
      tags: [Investigations]
      summary: Delete an investigation from the library
      parameters:
        - $ref: "#/components/parameters/InvestigationId"
      responses:
        "204":
          description: Investigation deleted.
        "404":
          description: Investigation not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /investigations/{id}/refresh-candidates:
    post:
      operationId: refreshInvestigationCandidates
      tags: [Investigations]
      summary: Find new location leads for a saved investigation
      parameters:
        - $ref: "#/components/parameters/InvestigationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshInvestigationCandidatesInput"
      responses:
        "200":
          description: Investigation updated with new location leads.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Investigation"
        "404":
          description: Investigation not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The analyzer did not return any new location leads.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: The image analyzer is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /investigations/{id}/photo:
    get:
      operationId: getInvestigationPhoto
      tags: [Investigations]
      summary: Serve the private photo attached to an investigation
      parameters:
        - $ref: "#/components/parameters/InvestigationId"
      responses:
        "200":
          description: Photo bytes.
          content:
            image/*:
              schema:
                type: string
                format: binary
        "404":
          description: Investigation or photo not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
components:
  parameters:
    InvestigationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        size:
          type: integer
          minimum: 1
          maximum: 26214400
        contentType:
          type: string
          enum:
            - image/jpeg
            - image/png
            - image/webp
            - image/avif
            - image/gif
            - image/bmp
            - image/x-ms-bmp
            - image/tiff
            - image/x-tiff
            - image/heic
            - image/heif
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"
    LocationCandidate:
      type: object
      required: [place, region, country, confidence, rationale, clues, mapsUrl]
      properties:
        place:
          type: string
        region:
          type: ["string", "null"]
        country:
          type: ["string", "null"]
        confidence:
          type: number
          minimum: 0
          maximum: 1
        rationale:
          type: string
        clues:
          type: array
          items:
            type: string
        mapsUrl:
          type: string
          format: uri
        photoReferences:
          type: array
          items:
            $ref: "#/components/schemas/LocationPhotoReference"
        photoSearchStatus:
          type: string
          enum: [found, no_results, unavailable]
    LocationPhotoReference:
      type: object
      required: [imageUrl, sourceUrl]
      properties:
        imageUrl:
          type: string
          format: uri
        thumbnailUrl:
          type: ["string", "null"]
          format: uri
        sourceUrl:
          type: string
          format: uri
        caption:
          type: ["string", "null"]
    VisualClue:
      type: object
      required: [label, observation, significance]
      properties:
        label:
          type: string
        observation:
          type: string
        significance:
          type: string
    Investigation:
      type: object
      required:
        - id
        - title
        - desk
        - originalName
        - contentType
        - context
        - shotAt
        - summary
        - candidates
        - clues
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        desk:
          type: string
          enum: [original, recreation, fake-news]
        originalName:
          type: string
        contentType:
          type: string
        context:
          type: ["string", "null"]
        shotAt:
          type: ["string", "null"]
          format: date
        summary:
          type: string
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/LocationCandidate"
        clues:
          type: array
          items:
            $ref: "#/components/schemas/VisualClue"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    InvestigationInput:
      type: object
      required: [objectPath, originalName, contentType, desk, clientRequestId]
      properties:
        objectPath:
          type: string
          minLength: 1
        clientRequestId:
          type: string
          format: uuid
        originalName:
          type: string
          minLength: 1
          maxLength: 255
        contentType:
          type: string
          enum:
            - image/jpeg
            - image/png
            - image/webp
            - image/avif
            - image/gif
            - image/bmp
            - image/x-ms-bmp
            - image/tiff
            - image/x-tiff
            - image/heic
            - image/heif
        desk:
          type: string
          enum: [original, recreation, fake-news]
        context:
          type: string
          maxLength: 3000
        journalismQuestion:
          type: string
          maxLength: 1000
        apiKey:
          type: string
          maxLength: 512
          description: Optional user-provided provider key. Never persist or log this value.
        shotAt:
          type: ["string", "null"]
          format: date
        title:
          type: string
          maxLength: 120
    InvestigationUpdate:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        context:
          type: ["string", "null"]
          maxLength: 3000
    RefreshInvestigationCandidatesInput:
      type: object
      required: [excludePlaces]
      properties:
        excludePlaces:
          type: array
          maxItems: 30
          items:
            type: string
            minLength: 1
            maxLength: 180
    InvestigationSummary:
      type: object
      required: [total, thisMonth, latest]
      properties:
        total:
          type: integer
        thisMonth:
          type: integer
        latest:
          anyOf:
            - $ref: "#/components/schemas/Investigation"
            - type: "null"

