openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Storage
    description: Private photo uploads and serving endpoints.
  - name: Investigations
    description: Photo location investigations and the user's saved library.
paths:
  /locator-health:
    get:
      operationId: getLocatorHealth
      summary: Check Image Locator video availability
      responses:
        "200":
          description: Current capabilities, with unavailable video disabled
          content:
            application/json:
              schema:
                type: object
                required: [video_enabled]
                properties:
                  video_enabled:
                    type: boolean
  /investigations/{id}/retry-analysis:
    post:
      operationId: retryInvestigationAnalysis
      summary: Retry a failed saved video analysis
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Saved investigation queued for analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Investigation"
  /cases:
    get:
      operationId: listMissingPersonCases
      tags: [Cases]
      responses:
        "200":
          description: Private cases owned by the signed-in user.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MissingPersonCase" }
    post:
      operationId: createMissingPersonCase
      tags: [Cases]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MissingPersonCaseInput" }
      responses:
        "201":
          description: Private case saved, or previously saved request returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MissingPersonCase" }
  /cases/{id}:
    parameters:
      - $ref: "#/components/parameters/InvestigationId"
    get:
      operationId: getMissingPersonCase
      tags: [Cases]
      responses:
        "200":
          description: Private case and its submitted leads.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MissingPersonCase" }
    put:
      operationId: updateMissingPersonCase
      tags: [Cases]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MissingPersonCaseInput" }
      responses:
        "200":
          description: Case details updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MissingPersonCase" }
    delete:
      operationId: deleteMissingPersonCase
      tags: [Cases]
      responses:
        "204": { description: Case and leads deleted. }
  /cases/{id}/review:
    parameters:
      - $ref: "#/components/parameters/InvestigationId"
    patch:
      operationId: saveCaseReview
      tags: [Cases]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CaseReviewInput" }
      responses:
        "200":
          description: Private manual review saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MissingPersonCase" }
        "409":
          description: A newer review exists. Keep the draft and reload the saved version before merging.
  /cases/{id}/leads:
    parameters:
      - $ref: "#/components/parameters/InvestigationId"
    post:
      operationId: createCaseLead
      tags: [Cases]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CaseLeadInput" }
      responses:
        "201":
          description: Lead saved without external fetching or analysis.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MissingPersonCase" }
  /cases/{id}/leads/{leadId}:
    parameters:
      - $ref: "#/components/parameters/InvestigationId"
      - name: leadId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: reviewCaseLead
      tags: [Cases]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CaseLeadReviewInput" }
      responses:
        "200":
          description: Responder's relevance assessment saved; not an independent verification.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MissingPersonCase" }
    delete:
      operationId: deleteCaseLead
      tags: [Cases]
      responses:
        "204": { description: Lead deleted. }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [Storage]
      summary: Request a private photo upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Invalid file metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /investigations:
    get:
      operationId: listInvestigations
      tags: [Investigations]
      summary: List the signed-in user's investigations
      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
            maxLength: 120
      responses:
        "200":
          description: Investigations belonging to the current user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Investigation"
    post:
      operationId: createInvestigation
      tags: [Investigations]
      summary: Analyze and save an uploaded photo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvestigationInput"
      responses:
        "200":
          description: Existing investigation returned for a replayed client request ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Investigation"
        "201":
          description: Photo analyzed and investigation saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Investigation"
        "400":
          description: Invalid investigation data or unsupported image.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Image-analysis provider quota is exhausted; the uploaded photo is retained for retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Photo analysis failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /investigations/summary:
    get:
      operationId: getInvestigationSummary
      tags: [Investigations]
      summary: Get counts and the latest saved investigation
      responses:
        "200":
          description: Current user's library summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvestigationSummary"
  /investigations/{id}:
    get:
      operationId: getInvestigation
      tags: [Investigations]
      summary: Get one saved investigation
      parameters:
        - $ref: "#/components/parameters/InvestigationId"
      responses:
        "200":
          description: The requested investigation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Investigation"
        "404":
          description: Investigation not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      operationId: updateInvestigation
      tags: [Investigations]
      summary: Update an investigation's title or background notes
      parameters:
        - $ref: "#/components/parameters/InvestigationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvestigationUpdate"
      responses:
        "200":
          description: Updated investigation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Investigation"
        "404":
          description: Investigation not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      operationId: deleteInvestigation
      tags: [Investigations]
      summary: Delete an investigation from the library
      parameters:
        - $ref: "#/components/parameters/InvestigationId"
      responses:
        "204":
          description: Investigation deleted.
        "404":
          description: Investigation not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /investigations/{id}/refresh-candidates:
    post:
      operationId: refreshInvestigationCandidates
      tags: [Investigations]
      summary: Find new location leads for a saved investigation
      parameters:
        - $ref: "#/components/parameters/InvestigationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshInvestigationCandidatesInput"
      responses:
        "200":
          description: Investigation updated with new location leads.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Investigation"
        "404":
          description: Investigation not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The analyzer did not return any new location leads.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: The image analyzer is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /investigations/{id}/photo:
    get:
      operationId: getInvestigationPhoto
      tags: [Investigations]
      summary: Serve the private photo attached to an investigation
      parameters:
        - $ref: "#/components/parameters/InvestigationId"
      responses:
        "200":
          description: Photo bytes.
          content:
            image/*:
              schema:
                type: string
                format: binary
        "404":
          description: Investigation or photo not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
components:
  parameters:
    InvestigationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    CaseReviewInput:
      type: object
      required: [observations, nextSteps, expectedRevision]
      properties:
        observations: { type: string, maxLength: 10000 }
        nextSteps: { type: string, maxLength: 10000 }
        expectedRevision: { type: integer, minimum: 0 }
    CaseReview:
      type: object
      required: [observations, nextSteps, revision, updatedAt]
      properties:
        observations: { type: string, maxLength: 10000 }
        nextSteps: { type: string, maxLength: 10000 }
        revision: { type: integer, minimum: 1 }
        updatedAt: { type: string, format: date-time }
    CaseLeadReviewInput:
      type: object
      required: [reviewStatus]
      properties:
        reviewStatus: { type: string, enum: [needs-verification, relevant, unrelated] }
    CasePhoto:
      type: object
      required: [objectPath, originalName, contentType]
      properties:
        objectPath: { type: string, pattern: "^/objects/uploads/[a-f0-9-]+$", maxLength: 200 }
        originalName: { type: string, minLength: 1, maxLength: 255 }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
    MissingPersonCaseInput:
      type: object
      required: [clientRequestId, firstName, responderRole, privacyAcknowledged]
      properties:
        clientRequestId: { type: string, format: uuid }
        firstName: { type: string, minLength: 1, maxLength: 80 }
        lastName: { type: string, maxLength: 80 }
        nickname: { type: string, maxLength: 80 }
        ageDescription: { type: string, maxLength: 40 }
        lastKnownDate: { type: ["string", "null"], pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        lastKnownArea: { type: string, maxLength: 160 }
        responderRole: { type: string, enum: [family-or-guardian, authorized-responder, other] }
        officialReference: { type: string, maxLength: 120 }
        notes: { type: string, maxLength: 3000 }
        privacyAcknowledged: { type: boolean, enum: [true] }
        headshot:
          anyOf:
            - $ref: "#/components/schemas/CasePhoto"
            - { type: "null" }
    CaseLeadInput:
      type: object
      required: [clientRequestId, kind, title, source, permissionGranted]
      properties:
        clientRequestId: { type: string, format: uuid }
        kind: { type: string, enum: [photo, link, tip] }
        title: { type: string, minLength: 1, maxLength: 160 }
        source: { type: string, minLength: 1, maxLength: 200 }
        sourceUrl: { type: string, maxLength: 2000 }
        notes: { type: string, maxLength: 3000 }
        reportedTakenOn: { type: ["string", "null"], pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        postedOn: { type: ["string", "null"], pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        permissionGranted: { type: boolean, enum: [true] }
        photo:
          anyOf:
            - $ref: "#/components/schemas/CasePhoto"
            - { type: "null" }
    CaseLead:
      allOf:
        - $ref: "#/components/schemas/CaseLeadInput"
        - type: object
          required: [id, reviewStatus, createdAt]
          properties:
            id: { type: string, format: uuid }
            reviewStatus: { type: string, enum: [needs-verification, relevant, unrelated] }
            createdAt: { type: string, format: date-time }
    MissingPersonCase:
      allOf:
        - $ref: "#/components/schemas/MissingPersonCaseInput"
        - type: object
          required: [id, createdAt, updatedAt, leads]
          properties:
            id: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            review: { $ref: "#/components/schemas/CaseReview" }
            leads:
              type: array
              items: { $ref: "#/components/schemas/CaseLead" }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        size:
          type: integer
          minimum: 1
          maximum: 62914560
        contentType:
          type: string
          enum:
            - image/jpeg
            - image/png
            - image/webp
            - image/avif
            - image/gif
            - image/bmp
            - image/x-ms-bmp
            - image/tiff
            - image/x-tiff
            - image/heic
            - image/heif
            - video/mp4
            - video/quicktime
            - video/webm
            - video/x-matroska
            - video/x-msvideo
            - video/3gpp
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"
    LocationCandidate:
      type: object
      required: [place, region, country, confidence, rationale, clues, mapsUrl]
      properties:
        place:
          type: string
        region:
          type: ["string", "null"]
        country:
          type: ["string", "null"]
        confidence:
          type: number
          minimum: 0
          maximum: 1
        rationale:
          type: string
        clues:
          type: array
          items:
            type: string
        mapsUrl:
          type: string
          format: uri
        photoReferences:
          type: array
          items:
            $ref: "#/components/schemas/LocationPhotoReference"
        photoSearchStatus:
          type: string
          enum: [found, no_results, unavailable]
    LocationPhotoReference:
      type: object
      required: [imageUrl, sourceUrl]
      properties:
        imageUrl:
          type: string
          format: uri
        thumbnailUrl:
          type: ["string", "null"]
          format: uri
        sourceUrl:
          type: string
          format: uri
        caption:
          type: ["string", "null"]
    VisualClue:
      type: object
      required: [label, observation, significance]
      properties:
        label:
          type: string
        observation:
          type: string
        significance:
          type: string
    InvestigationAnalysis:
      type: [object, "null"]
      description: Optional sanitized Image Locator metadata. Provider claims are not independent verification.
      additionalProperties: false
      properties:
        media_type:
          type: string
          enum: [video, image]
        video:
          type: object
          additionalProperties: false
          properties:
            duration_s: { type: number, minimum: 0 }
            fps: { type: number, minimum: 0 }
            frames_analyzed: { type: integer, minimum: 0 }
            embedded_gps:
              type: object
              additionalProperties: false
              required: [latitude, longitude]
              properties:
                latitude: { type: number, minimum: -90, maximum: 90 }
                longitude: { type: number, minimum: -180, maximum: 180 }
        contributing_frames:
          type: array
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            properties:
              index: { type: integer, minimum: 0 }
              timestamp_s: { type: number, minimum: 0 }
              candidates:
                type: array
                maxItems: 10
                items: { type: string, maxLength: 1200 }
              clues_found: { type: boolean }
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        map_url:
          type: string
          format: uri
          maxLength: 2000
        address:
          type: string
          maxLength: 1200
        confidence:
          type: number
          minimum: 0
          maximum: 1
        source:
          type: string
          maxLength: 1200
        verified:
          type: string
          maxLength: 1200
        warning:
          type: string
          maxLength: 1200
        meets_defined_radius:
          type: boolean
        defined_radius_km:
          type: number
          minimum: 0
        precision_m:
          type: number
          minimum: 0
        elevation_m:
          type: number
        search_areas:
          type: array
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            properties:
              rank:
                type: integer
                minimum: 1
              name:
                type: string
                maxLength: 1200
              country:
                type: string
                maxLength: 1200
              latitude:
                type: number
                minimum: -90
                maximum: 90
              longitude:
                type: number
                minimum: -180
                maximum: 180
              search_radius_km:
                type: number
                minimum: 0
              score:
                type: number
                minimum: 0
                maximum: 1
              map_status:
                type: string
                maxLength: 1200
        rejected:
          type: array
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            properties:
              name:
                type: string
                maxLength: 1200
              reason:
                type: string
                maxLength: 1200
        nearby_places:
          type: array
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            properties:
              title:
                type: string
                maxLength: 1200
              distance_km:
                type: number
                minimum: 0
        forensics:
          type: object
          additionalProperties: false
          properties:
            has_gps:
              type: boolean
            authenticity:
              type: string
              maxLength: 1200
            edited:
              type: boolean
            is_screenshot:
              type: boolean
            metadata_stripped:
              type: boolean
            notes:
              type: array
              maxItems: 10
              items:
                type: string
                maxLength: 1200
        reasoning_trace:
          type: array
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            properties:
              stage:
                type: string
                maxLength: 1200
              details:
                type: array
                maxItems: 10
                items:
                  type: string
                  maxLength: 1200
              step:
                type: string
                maxLength: 1200
              detail:
                type: string
                maxLength: 1200
        details:
          type: object
          additionalProperties: false
          properties:
            exif:
              type: object
              additionalProperties: false
              properties:
                timestamp:
                  type: string
                  maxLength: 1200
    Investigation:
      type: object
      required:
        - id
        - title
        - desk
        - originalName
        - contentType
        - context
        - shotAt
        - summary
        - candidates
        - clues
        - createdAt
        - updatedAt
      properties:
        status:
          type: [string, "null"]
          enum: [analyzing, done, failed, null]
        analysisError:
          type: [string, "null"]
        id:
          type: string
          format: uuid
        title:
          type: string
        desk:
          type: string
          enum: [original, recreation, fake-news]
        originalName:
          type: string
        contentType:
          type: string
        context:
          type: ["string", "null"]
        shotAt:
          type: ["string", "null"]
          format: date
        summary:
          type: string
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/LocationCandidate"
        clues:
          type: array
          items:
            $ref: "#/components/schemas/VisualClue"
        analysis:
          $ref: "#/components/schemas/InvestigationAnalysis"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    InvestigationInput:
      type: object
      required: [objectPath, originalName, contentType, desk, clientRequestId]
      properties:
        objectPath:
          type: string
          minLength: 1
        clientRequestId:
          type: string
          format: uuid
        originalName:
          type: string
          minLength: 1
          maxLength: 255
        contentType:
          type: string
          enum:
            - image/jpeg
            - image/png
            - image/webp
            - image/avif
            - image/gif
            - image/bmp
            - image/x-ms-bmp
            - image/tiff
            - image/x-tiff
            - image/heic
            - image/heif
            - video/mp4
            - video/quicktime
            - video/webm
            - video/x-matroska
            - video/x-msvideo
            - video/3gpp
        desk:
          type: string
          enum: [original, recreation, fake-news]
        context:
          type: string
          maxLength: 3000
        journalismQuestion:
          type: string
          maxLength: 1000
        apiKey:
          type: string
          maxLength: 512
          description: Optional user-provided provider key. Never persist or log this value.
        shotAt:
          type: ["string", "null"]
          format: date
        title:
          type: string
          maxLength: 120
    InvestigationUpdate:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        context:
          type: ["string", "null"]
          maxLength: 3000
    RefreshInvestigationCandidatesInput:
      type: object
      required: [excludePlaces]
      properties:
        excludePlaces:
          type: array
          maxItems: 30
          items:
            type: string
            minLength: 1
            maxLength: 180
    InvestigationSummary:
      type: object
      required: [total, thisMonth, latest]
      properties:
        total:
          type: integer
        thisMonth:
          type: integer
        latest:
          anyOf:
            - $ref: "#/components/schemas/Investigation"
            - type: "null"

